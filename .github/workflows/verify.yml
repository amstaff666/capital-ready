name: Verify CapitalReady

on:
  pull_request:
  push:
    branches:
      - feat/luuna-case-platform

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile backend/main.py
      - run: python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('rules').glob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          json.loads(Path('config/markets.json').read_text(encoding='utf-8'))
          print('country configs valid')
          PY
